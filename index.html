<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting - Az Zahir Shop</title>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif, -apple-system, BlinkMacSystemFont;
      background-color: #0b0f19;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: rgba(21, 27, 38, 0.85);
      border: 1px solid rgba(0, 255, 170, 0.3);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 255, 170, 0.15);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0, 255, 170, 0.2);
      border-top-color: #00ffaa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #00ffaa;
    }
    p {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      background: #00ffaa;
      color: #05140f;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 255, 170, 0.3);
    }
    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }
  </style>
  <script>
    // Pengalihan otomatis instan ke URL Web App Apps Script
    window.location.replace("https://script.google.com/macros/s/AKfycbyuwt7xcuE6A8ClOjLhHctzhcUubFZZR3rhwKMFoMCBNeaFpl1BVWPIT6S04EPJr7DuUA/exec");
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Mengarahkan ke Az Zahir Shop...</h1>
    <p>Anda sedang dialihkan ke sistem katalog online dan manajemen pesanan resmi Toko Az Zahir Shop.</p>
    <a href="https://script.google.com/macros/s/AKfycbyuwt7xcuE6A8ClOjLhHctzhcUubFZZR3rhwKMFoMCBNeaFpl1BVWPIT6S04EPJr7DuUA/exec" class="btn">
      Klik Disini Jika Tidak Otomatis
    </a>
  </div>
</body>
</html>
